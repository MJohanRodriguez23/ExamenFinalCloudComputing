AWSTemplateFormatVersion: '2010-09-09'
Description: Stack Security Groups - Jorge-Miguel

Resources:

  # 1. Grupo de Seguridad para el Application Load Balancer
  SGParaALB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group para Application Load Balancer
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0 # El ALB recibe tráfico público de internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SG-ALB-Jorge-Miguel

  # 2. Grupo de Seguridad para la instancia EC2
  SGParaEC2:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group para instancia EC2 publica e instancias del ASG
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0 # Permite SSH para administración
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref SGParaALB # Buenas prácticas: La EC2 solo escucha al ALB
      Tags:
        - Key: Name
          Value: SG-EC2-Jorge-Miguel

Outputs:

  SGEc2Id:
    Description: ID del Security Group de la EC2 para importar en otros stacks
    Value: !Ref SGParaEC2
    Export:
      Name: !Sub '${AWS::StackName}-EC2SecurityGroupId'

  SGAlbId:
    Description: ID del Security Group del ALB para importar en otros stacks
    Value: !Ref SGParaALB
    Export:
      Name: !Sub '${AWS::StackName}-ALBSecurityGroupId'
