AWSTemplateFormatVersion: '2010-09-09'
Description: Stack EC2 Estatica -Jorge-Miguel

Resources:

  InstanciaEC2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0c02fb55956c7d316
      SecurityGroupIds:
        - !ImportValue SG-EC2-Jorge-Miguel
      Tags:
        - Key: Name
          Value: EC2-Jorge-Miguel
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hola desde EC2 - Jorge-Miguel 👍👌</h1>" > /var/www/html/index.html

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref InstanciaEC2
      Tags:
        - Key: Name
          Value: EIP-Jorge-Miguel

Outputs:

  IPPublica:
    Description: IP publica estatica de la EC2
    Value: !Ref ElasticIP
    Export:
      Name: EC2-EIP-Jorge-Miguel

  IDInstancia:
    Description: ID de la instancia EC2
    Value: !Ref InstanciaEC2
    Export:
      Name: EC2-ID-Jorge-Miguel